when:
  - event: tag
    branch: main

steps:
  - name: test-secrets
    image: alpine
    environment:
      TEST_SECRET:
        from_secret: cf_account_id
    commands:
      - 'if [ -n "$$TEST_SECRET" ]; then echo "SECRET IS SET"; else echo "SECRET IS EMPTY"; fi'

  - name: build-linux
    image: debian:bookworm
    directory: xm
    commands:
      # Install system dependencies
      - apt-get update && apt-get install -y guile-3.0 guile-3.0-dev pkg-config curl build-essential libclang-dev

      # Install latest Rust (needed for oxigraph edition2024)
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - . "$HOME/.cargo/env"
      - rustup update

      # Build the Rust FFI library
      - cargo build --release

      # Run tests
      - cargo test --release

      # Create distribution directory
      - mkdir -p dist/xm-dist/lib
      - mkdir -p dist/xm-dist/share/guile/site/3.0/xm/cli
      - mkdir -p dist/xm-dist/bin

      # Copy library
      - cp target/release/libxm_ffi.so dist/xm-dist/lib/

      # Copy Guile modules
      - cp guile/xm/*.scm dist/xm-dist/share/guile/site/3.0/xm/
      - cp guile/xm/cli/*.scm dist/xm-dist/share/guile/site/3.0/xm/cli/

      # Copy wrapper script
      - cp bin/xm dist/xm-dist/bin/
      - chmod +x dist/xm-dist/bin/xm

      # Create archive
      - cd dist && tar -czvf xm-linux-x86_64.tar.gz xm-dist && cd ..

      # Create version.json
      - |
        cat > dist/version.json << EOF
        {
          "version": "${CI_COMMIT_TAG#v}",
          "download_url": "https://files.anuna.io/xm/${CI_COMMIT_TAG}"
        }
        EOF

      # Create install script
      - |
        cat > dist/install.sh << 'INSTALL_EOF'
        #!/bin/bash
        set -e

        # xm Installer
        # Linked Memory for LLM Agents
        #
        # Prerequisites:
        #   - Guile 3.0+
        #   - Goblins (guix install guile-goblins)

        TOOL_NAME="xm"
        VERSION="$${VERSION:-latest}"
        BASE_URL="https://files.anuna.io/xm"
        INSTALL_DIR="$${INSTALL_DIR:-$$HOME/.local/bin}"
        LIB_DIR="$${INSTALL_DIR%/bin}/lib"
        SHARE_DIR="$${INSTALL_DIR%/bin}/share"

        # Colors for output
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        BLUE='\033[0;34m'
        NC='\033[0m'

        info() { echo -e "$${GREEN}[INFO]$${NC} $$1"; }
        warn() { echo -e "$${YELLOW}[WARN]$${NC} $$1"; }
        error() { echo -e "$${RED}[ERROR]$${NC} $$1"; exit 1; }
        step() { echo -e "$${BLUE}[STEP]$${NC} $$1"; }

        detect_platform() {
          local detected_os detected_arch

          detected_os="$$(uname -s 2>/dev/null | tr '[:upper:]' '[:lower:]')"
          detected_arch="$$(uname -m 2>/dev/null)"

          case "$$detected_os" in
            linux*)  OS="linux" ;;
            darwin*) OS="macos" ;;
            *)       error "Unsupported OS: $$detected_os. See build from source instructions." ;;
          esac

          case "$$detected_arch" in
            x86_64|amd64)  ARCH="x86_64" ;;
            arm64|aarch64) ARCH="arm64" ;;
            *)             error "Unsupported architecture: $$detected_arch" ;;
          esac

          PLATFORM="$${OS}-$${ARCH}"
          info "Detected platform: $$PLATFORM"

          # Check for macOS builds
          if [[ "$$OS" == "macos" ]]; then
            warn "Pre-built macOS binaries may not be available."
            warn "If download fails, build from source:"
            echo "  git clone https://codeberg.org/anuna/meld && cd meld/xm && make install"
          fi
        }

        check_prerequisites() {
          step "Checking prerequisites..."

          # Check for Guile
          if ! command -v guile >/dev/null 2>&1; then
            error "Guile 3.0+ is required but not found.

        Install Guile:
          # Debian/Ubuntu
          sudo apt install guile-3.0

          # Fedora
          sudo dnf install guile30

          # macOS (Homebrew)
          brew install guile

          # Guix
          guix install guile"
          fi

          # Check Guile version
          GUILE_VERSION=$$(guile --version | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          GUILE_MAJOR=$$(echo "$$GUILE_VERSION" | cut -d. -f1)
          if [[ "$$GUILE_MAJOR" -lt 3 ]]; then
            error "Guile 3.0+ required, found $$GUILE_VERSION"
          fi
          info "Found Guile $$GUILE_VERSION"

          # Check for Goblins (optional but recommended)
          if guile -c "(use-modules (goblins))" 2>/dev/null; then
            info "Found Goblins"
          else
            warn "Goblins not found (optional, needed for networking features)"
            echo "  Install: guix install guile-goblins"
          fi
        }

        get_version() {
          if [[ "$$VERSION" == "latest" ]]; then
            step "Fetching latest version..."
            VERSION=$$(curl -fsSL "$$BASE_URL/latest/version.json" 2>/dev/null | grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' | cut -d'"' -f4)
            if [[ -z "$$VERSION" ]]; then
              error "Could not determine latest version"
            fi
            info "Latest version: v$$VERSION"
          fi
        }

        install_binary() {
          step "Installing $$TOOL_NAME v$$VERSION for $$PLATFORM..."

          TMP_DIR=$$(mktemp -d)
          trap 'rm -rf "$$TMP_DIR"' EXIT

          # Construct download URL
          ARCHIVE_NAME="xm-$${PLATFORM}.tar.gz"
          DOWNLOAD_URL="$$BASE_URL/v$$VERSION/$$ARCHIVE_NAME"
          ARCHIVE_FILE="$$TMP_DIR/$$ARCHIVE_NAME"

          info "Downloading from: $$DOWNLOAD_URL"

          if command -v curl >/dev/null 2>&1; then
            if ! curl -fsSL "$$DOWNLOAD_URL" -o "$$ARCHIVE_FILE"; then
              error "Download failed. Pre-built binary may not exist for $$PLATFORM.
        Build from source instead:
          git clone https://codeberg.org/anuna/meld && cd meld/xm && make install"
            fi
          elif command -v wget >/dev/null 2>&1; then
            if ! wget -q "$$DOWNLOAD_URL" -O "$$ARCHIVE_FILE"; then
              error "Download failed."
            fi
          else
            error "curl or wget is required"
          fi

          # Extract archive
          info "Extracting archive..."
          tar -xzf "$$ARCHIVE_FILE" -C "$$TMP_DIR"

          # Create directories
          mkdir -p "$$INSTALL_DIR"
          mkdir -p "$$LIB_DIR"
          mkdir -p "$$SHARE_DIR/guile/site/3.0"

          # Install library
          if [[ -f "$$TMP_DIR/xm-dist/lib/libxm_ffi.so" ]]; then
            cp "$$TMP_DIR/xm-dist/lib/libxm_ffi.so" "$$LIB_DIR/"
            info "Library installed to: $$LIB_DIR/libxm_ffi.so"
          elif [[ -f "$$TMP_DIR/xm-dist/lib/libxm_ffi.dylib" ]]; then
            cp "$$TMP_DIR/xm-dist/lib/libxm_ffi.dylib" "$$LIB_DIR/"
            info "Library installed to: $$LIB_DIR/libxm_ffi.dylib"
          fi

          # Install Guile modules
          cp -r "$$TMP_DIR/xm-dist/share/guile/site/3.0/xm" "$$SHARE_DIR/guile/site/3.0/"
          info "Guile modules installed to: $$SHARE_DIR/guile/site/3.0/xm"

          # Install binary
          cp "$$TMP_DIR/xm-dist/bin/xm" "$$INSTALL_DIR/"
          chmod +x "$$INSTALL_DIR/xm"
          info "Binary installed to: $$INSTALL_DIR/xm"

          # Check PATH
          if [[ ":$$PATH:" != *":$$INSTALL_DIR:"* ]]; then
            echo ""
            warn "$$INSTALL_DIR is not in your PATH"
            echo ""
            echo "Add it to your shell profile:"
            if [[ -f "$$HOME/.zshrc" ]]; then
              echo "  echo 'export PATH=\"\$$HOME/.local/bin:\$$PATH\"' >> ~/.zshrc"
              echo "  source ~/.zshrc"
            else
              echo "  echo 'export PATH=\"\$$HOME/.local/bin:\$$PATH\"' >> ~/.bashrc"
              echo "  source ~/.bashrc"
            fi
          fi

          # Environment setup
          echo ""
          info "Environment setup required:"
          echo ""
          echo "Add to your shell profile:"
          echo "  export GUILE_LOAD_PATH=\"$$SHARE_DIR/guile/site/3.0:\$$GUILE_LOAD_PATH\""
          echo "  export XM_LIB_PATH=\"$$LIB_DIR\""
        }

        print_instructions() {
          echo ""
          echo "=========================================="
          echo "  Installation Complete!"
          echo "=========================================="
          echo ""
          echo "Quick Start:"
          echo ""
          echo "  # Create a node"
          echo "  xm node create --type entity --title \"My Note\""
          echo ""
          echo "  # Query nodes"
          echo "  xm query nodes"
          echo ""
          echo "  # Show help"
          echo "  xm --help"
          echo ""
          echo "Documentation: https://codeberg.org/anuna/meld"
          echo "Downloads: https://files.anuna.io/xm"
          echo ""
        }

        main() {
          echo ""
          echo "=========================================="
          echo "  xm Installer - Linked Memory for LLM Agents"
          echo "=========================================="
          echo ""

          detect_platform
          check_prerequisites
          get_version
          install_binary
          print_instructions
        }

        main "$$@"
        INSTALL_EOF
        chmod +x dist/install.sh

      # Create release notes
      - |
        cat > release-notes.md << EOF
        ## Release ${CI_COMMIT_TAG}

        xm - Linked Memory for LLM Agents

        ### Quick Install (Linux x86_64)

        \`\`\`bash
        curl -fsSL https://files.anuna.io/xm/latest/install.sh | bash
        \`\`\`

        Or for this specific version:
        \`\`\`bash
        curl -fsSL https://files.anuna.io/xm/${CI_COMMIT_TAG}/install.sh | bash
        \`\`\`

        ### Prerequisites

        - **Guile 3.0+** - Required
        - **Goblins** - Optional, needed for networking features

        Install prerequisites:
        \`\`\`bash
        # Debian/Ubuntu
        sudo apt install guile-3.0

        # macOS (Homebrew)
        brew install guile

        # Goblins (via Guix)
        guix install guile-goblins
        \`\`\`

        ### macOS Installation

        Pre-built macOS binaries may not be available. Build from source:

        \`\`\`bash
        # Install dependencies
        brew install guile rust

        # Clone and build
        git clone https://codeberg.org/anuna/meld
        cd meld/xm
        make build
        make install PREFIX=~/.local
        \`\`\`

        ### Usage

        \`\`\`bash
        # Create a node
        xm node create --type entity --title "My First Note"

        # Query nodes
        xm query nodes

        # Link nodes
        xm link create <source-id> <target-id> --predicate "relatedTo"

        # SPARQL query
        xm query sparql "SELECT ?s ?p ?o WHERE { ?s ?p ?o } LIMIT 10"

        # Show help
        xm --help
        \`\`\`
        EOF

      - ls -la dist/

  - name: upload-to-cloudflare-r2
    image: amazon/aws-cli:2.15.0
    directory: xm
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: cf_r2_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: cf_r2_secret_access_key
      CF_ACCOUNT_ID:
        from_secret: cf_account_id
    commands:
      # Debug secrets
      - 'echo "CF_ACCOUNT_ID length: $${#CF_ACCOUNT_ID}"'
      - 'echo "AWS_ACCESS_KEY_ID length: $${#AWS_ACCESS_KEY_ID}"'

      # Configure AWS CLI for Cloudflare R2
      - export AWS_DEFAULT_REGION=auto
      - export R2_ENDPOINT="https://$${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
      - export BUCKET="anuna-files"
      - export PROJECT="xm"

      # Upload versioned release
      - echo "Uploading to $${PROJECT}/$${CI_COMMIT_TAG}/..."
      - |
        for file in dist/xm-*.tar.gz dist/version.json dist/install.sh; do
          if [ -f "$$file" ]; then
            filename=$$(basename "$$file")
            aws s3 cp "$$file" "s3://$${BUCKET}/$${PROJECT}/$${CI_COMMIT_TAG}/$$filename" \
              --endpoint-url "$$R2_ENDPOINT"
            echo "Uploaded: $$filename"
          fi
        done

      # Upload to latest/
      - echo "Uploading to $${PROJECT}/latest/..."
      - |
        for file in dist/xm-*.tar.gz dist/version.json dist/install.sh; do
          if [ -f "$$file" ]; then
            filename=$$(basename "$$file")
            aws s3 cp "$$file" "s3://$${BUCKET}/$${PROJECT}/latest/$$filename" \
              --endpoint-url "$$R2_ENDPOINT"
            echo "Uploaded to latest: $$filename"
          fi
        done

      # List uploaded files
      - echo "Files in $${PROJECT}/$${CI_COMMIT_TAG}:"
      - aws s3 ls "s3://$${BUCKET}/$${PROJECT}/$${CI_COMMIT_TAG}/" --endpoint-url "$$R2_ENDPOINT"
      - echo "Files in $${PROJECT}/latest:"
      - aws s3 ls "s3://$${BUCKET}/$${PROJECT}/latest/" --endpoint-url "$$R2_ENDPOINT"
      - echo ""
      - echo "Release available at:"
      - echo "  https://files.anuna.io/$${PROJECT}/$${CI_COMMIT_TAG}/"
      - echo "  https://files.anuna.io/$${PROJECT}/latest/"
