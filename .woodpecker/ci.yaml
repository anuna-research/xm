when:
  - event: [push, pull_request]

steps:
  - name: test
    image: debian:bookworm
    directory: xm
    commands:
      # Install system dependencies
      - apt-get update && apt-get install -y curl build-essential pkg-config guile-3.0 guile-3.0-dev

      # Install latest Rust (needed for oxigraph edition2024)
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - . "$HOME/.cargo/env"
      - rustup update

      # Build the Rust FFI library
      - cargo build --release

      # Run Rust tests
      - cargo test --release

      # Run basic Guile integration test
      - |
        export GUILE_LOAD_PATH=$(pwd)/guile
        export XM_LIB_PATH=$(pwd)/target/release
        rm -rf /tmp/xm-ci-test
        guile --no-auto-compile -c '
          (use-modules (xm store))
          (let ((store (make-store "/tmp/xm-ci-test")))
            (store-update store "INSERT DATA { <http://test/s> <http://test/p> \"value\" }")
            (let ((count (store-count store)))
              (store-close store)
              (if (= count 1)
                  (display "PASS: Store insert works\n")
                  (error "FAIL: Expected count 1"))))'
        rm -rf /tmp/xm-ci-test
