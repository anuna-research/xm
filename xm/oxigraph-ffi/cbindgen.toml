# cbindgen configuration for generating C headers from Rust FFI

language = "C"
include_guard = "XM_FFI_H"
autogen_warning = "/* Warning: This file is auto-generated by cbindgen. Do not edit manually. */"

[export]
prefix = "xm_"

[fn]
rename_args = "SnakeCase"

[enum]
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
